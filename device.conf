# The phone, for the common repository's device tooling (the same fields as hakios-mt6768's device.conf).
device a22
	title	Samsung Galaxy A22 4G (SM-A225F)
	vendor	Samsung
	soc	mt6769v
	status boot works mtkloader in boot in front of Android, 4 cores, returns to Android after each run
	status storage works, read only the system image off the eMMC (emmc_root=1), 4 GiB xnusys
	status display works 720x1600 command-mode DSI, iOS at scale 2 (fbscale=2); watcher + DSI busy check
	status touch partial STM FTS5CU56A / Melfas MSS100 on I2C6 0x49/0x48, bit-banged GPIO89/90, rails power-cycled, Melfas normal touch mode + INTR trigger (touchscreen=3; needs a phone run to confirm)
	status buttons partial power (PMIC TOPSTATUS bit 1) works; volume up/down updated for A22 matrix key 17 / PMIC homekey with PWRAP lock (buttons=2 keyraw=1)
	status gpu works Mali-G52 MC2 brought up by kernel (mali=1); panfrost + hakios-drm synced with MT6768
	status metal works Mali Metal driver, synchronous mode fixes tearing/breakcore (rwm_async=0 rwm_finish=1), default.metallib assert handled in inject.c
	status cpu works 4 cores, A75 at 1999 MHz and A55 at 1699 MHz (mtk_cpufreq=3)
	status battery works MT6358 BATADC voltage estimate and CHRDET (battery=2) with PWRAP mutex protection
	status sensors partial SCP sensor hub runs and the accelerometer streams (scp_step=6); rotation needs the user-space feed
	status wifi partial CONNSYS & gen4m FullMAC driver ported (redwood_connsys.c, redwood_mtkwifi.c, redwood_wpa.c); firmware via pull-firmware.sh (connsys_step=17)
	status bluetooth partial MT6631 HCI over STP on BTIF (redwood_btsk.c, RedwoodBluetooth.cpp); bluetoothd state 5 and BLE scan
	status audio missing
	status camera partial CAMSYS / SENINF pipeline (mtkcam=5)
	status haptic missing
	status cellular missing
